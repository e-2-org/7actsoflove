# Say Cheese photos on archive/saycheese/photos.html, one entry per city
#
# blob, label: the coloured blob and the city's name, in archive/images/
# x, y:        where the blob sits on the page; the whole group then drifts
#              sideways by a random amount (drift: 1 to the right, -1 to the left)
# label_at:    where the name sits, relative to the blob's left edge and the page top
# photos:      [x, y] of each thumbnail, relative to the blob's left edge and the page top;
#              the photos are archive/saycheese/images/photos/1000x700/<city><n>.jpg
#              with 50x35 thumbnails in .../photos/thumbs/

- city: berlin
  name: Berlin
  blob: blue_blob.gif
  label: { src: berlin_text.gif, w: 116, h: 45 }
  label_at: [360, 74]
  x: 50
  y: 75
  drift: 1
  photos: [[20, 120], [90, 155], [170, 100], [267, 127], [400, 145]]

