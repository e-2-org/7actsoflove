<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<link rel="icon" type="image/png" href="{{ '/icons/favicon-96x96.png' | relative_url }}" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="{{ '/icons/favicon.svg' | relative_url }}" />
<link rel="shortcut icon" href="{{ '/icons/favicon.ico' | relative_url }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/icons/apple-touch-icon.png' | relative_url }}" />
<meta name="apple-mobile-web-app-title" content="{{ site.title }}" />
<link rel="manifest" href="{{ '/icons/site.webmanifest' | relative_url }}" />
<link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
{{ content }}
<script src="{{ '/js/site.js' | relative_url }}"></script>
</body>
</html>
