        document.write('<td valign="top" height="20"><span class="active">'+i+'</span></td>');
    }else{
        document.write('<td valign="top"><a href="diagrams.html?d='+i+'" class="menu">'+i+'</a></td>');

}
if (diag_id < diags) {
    nextlink = ['<a href="diagrams.html?d='+(diag_id + 1)+'">','</a>'];

}
document.write('</tr></table></div>');
